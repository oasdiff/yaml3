---
name: Go
on: [push, pull_request]
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The module requires go 1.22.5 and the code uses modern features
        # (range-over-int, any), so test the floor through the latest stable.
        # The old upstream matrix (Go 1.5..tip in GOPATH mode) couldn't build
        # this fork at all.
        go: ["1.22.x", "1.23.x", "stable"]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go }}
    - run: go test -race ./...

  # Verify the module lockfile: the committed go.sum must be complete (git diff
  # after download) and the cached modules must match their checksums (go mod
  # verify) -- so a go.mod pinned to a release tag can't ship with only a
  # pseudo-version (or a missing entry) in go.sum, which fails a clean
  # -mod=readonly build but is invisible to a CI that downloads before testing.
  modules:
    name: Verify modules
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v6
      with:
        go-version: stable
    - run: go mod download
    - run: git diff --exit-code -- go.mod go.sum
    - run: go mod verify
